[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heldmark"
version = "0.1.0"
description = "Follows one school learner. Cited quizzes, projects, and notes update a sourced profile."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Okoh Yeboah" }]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
heldmark = "heldmark.__main__:main"
heldmark-records = "heldmark.server:main"

[tool.setuptools]
packages = ["heldmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
